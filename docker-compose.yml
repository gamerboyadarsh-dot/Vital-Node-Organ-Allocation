version: '3.8'

services:
  vitalnode:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:./dev.db
    volumes:
      - vitalnode-data:/app/backend/prisma
    restart: unless-stopped

volumes:
  vitalnode-data:
