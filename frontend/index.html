<!DOCTYPE html>
<html lang="en" data-theme="blueprint">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitalNode — Organ Allocation Network</title>
    <script>
      (function() {
        var saved = localStorage.getItem('vn_theme');
        if (saved === 'dark' || saved === 'blueprint') {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          document.documentElement.setAttribute('data-theme', 'blueprint');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
